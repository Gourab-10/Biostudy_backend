server {
    listen 80;
    
    # TODO: Replace YOUR_DOMAIN_OR_IP with your actual VPS IP address (e.g., 123.45.67.89) 
    # or domain name (e.g., api.biospark.com)
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 50M;

    # Proxy requests to the Node.js backend running on PM2
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded files directly via Nginx for better performance
    location /uploads/ {
        # TODO: If your username on the VPS is not 'user', change '/home/user/biospark_backend/uploads/'
        alias /home/user/biospark_backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
